{% extends "base.html" %}

{% block title %}Фотографии{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
  <h1 class="h4 m-0">Все фотографии</h1>
  <a class="btn btn-outline-secondary" href="{% url 'admin_properties_list' %}">← Объекты</a>
</div>

<div class="row g-3">
  {% if photos_enriched %}
    {% for ph, addr in photos_enriched %}
      <div class="col-md-4 col-lg-3">
        <div class="card shadow-sm">
          <img class="card-img-top" alt="" src="{{ ph.absoluteUrl }}">
          <div class="card-body py-2 small">
            <div class="fw-semibold">{{ addr }}</div>
          </div>
        </div>
      </div>
    {% endfor %}
  {% else %}
    <div class="col-12 alert alert-light border mb-0">Нет данных.</div>
  {% endif %}
</div>
{% endblock %}

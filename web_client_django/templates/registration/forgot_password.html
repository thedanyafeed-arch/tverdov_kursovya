{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Восстановление пароля</h1>
        <p class="text-secondary mb-0">
          Если вы уже зарегистрированы, сменить пароль можно в разделе профиля после входа в систему.
        </p>
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <a class="btn btn-primary" href="{% url 'login' %}">Войти</a>
          <a class="btn btn-outline-secondary" href="{% url 'profile' %}">Сменить пароль в профиле</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

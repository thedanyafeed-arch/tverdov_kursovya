{% extends "base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
  <h1 class="h4 m-0">Профиль</h1>
  <a class="btn btn-outline-secondary" href="{% url 'account' %}">← Кабинет</a>
</div>

<div class="card shadow-sm">
  <div class="card-body p-4">
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Новый email (опционально)</label>
          {{ form.email }}
        </div>
        <div class="col-md-6">
          <label class="form-label">Новый пароль (опционально)</label>
          {{ form.password }}
        </div>
      </div>
      <div class="mt-3 d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-outline-secondary" href="{% url 'logout' %}">Выйти</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
